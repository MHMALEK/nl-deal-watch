name: Watch deals

# GitHub-hosted runners are blocked by Tweakers (HTTP 403), so this workflow
# does not run on a schedule. The hourly scan runs on the Mac via launchd.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Restore offers already sent
        uses: actions/cache/restore@v4
        with:
          path: data/deals.sqlite
          key: deals-${{ github.run_id }}
          restore-keys: |
            deals-

      - name: Scan Tweakers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m nl_deal_watch --once

      - name: Remember offers already sent
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/deals.sqlite
          key: deals-${{ github.run_id }}
